name: Compilar APK de Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      # La llave de la API y el ID de la carpeta raíz de la Nube salen de los "secrets" del repositorio
      # (Settings > Secrets and variables > Actions): VITE_DRIVE_API_KEY y VITE_DRIVE_ROOT_ID. Nunca van en el código.
      - name: Instalar dependencias y compilar la web
        env:
          VITE_DRIVE_API_KEY: ${{ secrets.VITE_DRIVE_API_KEY }}
          VITE_DRIVE_ROOT_ID: ${{ secrets.VITE_DRIVE_ROOT_ID }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: crescendo-live-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
