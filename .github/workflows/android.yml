name: Compilar APK de Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      # La configuración de la nube sale de los "secrets" del repositorio (Settings > Secrets and variables > Actions):
      # VITE_CRESCENDO_API_URL, VITE_SUPABASE_URL y VITE_SUPABASE_PUBLISHABLE_KEY. Nunca van en el código.
      - name: Instalar dependencias y compilar la web
        env:
          VITE_CRESCENDO_API_URL: ${{ secrets.VITE_CRESCENDO_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      # Release firmado (minificado con R8, sin depuración): requiere los secrets ANDROID_KEYSTORE_BASE64 (la llave .jks en base64),
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD. Sin ellos se compila el APK de depuración como antes
      # (la depuración del WebView queda apagada igual: ver capacitor.config.ts).
      - name: Preparar la firma de release (si hay llave)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi

      - uses: actions/upload-artifact@v4
        with:
          name: crescendo-live-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
