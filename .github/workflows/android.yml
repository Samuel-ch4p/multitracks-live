name: Compilar APK de Android

on:
  workflow_dispatch:
    inputs:
      minify:
        description: "Minificar con R8 (desmarca si la app falla en el celular)"
        type: boolean
        default: true
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      # La configuración de la nube sale de los "secrets" del repositorio (Settings > Secrets and variables > Actions):
      # VITE_CRESCENDO_API_URL, VITE_SUPABASE_URL y VITE_SUPABASE_PUBLISHABLE_KEY. Nunca van en el código.
      - name: Instalar dependencias y compilar la web
        env:
          VITE_CRESCENDO_API_URL: ${{ secrets.VITE_CRESCENDO_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      # SIEMPRE release firmado con la keystore fija del repositorio de secrets. Sin los 4 secrets el trabajo falla (nunca cae a debug,
      # porque una llave de depuración distinta en cada ejecución impediría instalar el APK encima del anterior).
      # Secrets (Settings > Secrets and variables > Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. GitHub enmascara sus valores en el log; aquí nunca se imprimen.
      - name: Preparar la keystore de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Faltan secrets de firma::Crea estos secrets en GitHub (Settings > Secrets and variables > Actions):$missing. No se compila sin firma fija."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # R8 (minify) activado por defecto. Si el build con R8 falla, se reintenta UNA vez sin minificar (sigue siendo release firmado)
      # y el aviso en el log y en el resumen dice que se compiló sin minificar. También se puede lanzar sin minificar a propósito.
      - name: Compilar APK de release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MINIFY: ${{ github.event.inputs.minify == 'false' && 'false' || 'true' }}
        run: |
          chmod +x gradlew
          if [ "$MINIFY" = "true" ]; then
            if ./gradlew assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
              echo "Compilado CON minificación (R8)." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning title=R8 falló::Se reintenta sin minificar. Primeras líneas del error de R8/minify:"
            grep -n -m 20 -E "R8|minify|ProGuard|Missing class|Execution failed|error:" "$RUNNER_TEMP/gradle.log" || true
            echo "R8 FALLÓ: este APK se compiló SIN minificar. Causa en el log (paso 'Compilar APK de release')." >> "$GITHUB_STEP_SUMMARY"
          fi
          ./gradlew assembleRelease -PnoMinify
          echo "Compilado SIN minificación." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verificar la firma e imprimir el SHA-256 del certificado
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then echo "::error::No existe $APK (¿salió unsigned?)"; ls -R android/app/build/outputs/apk || true; exit 1; fi
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          SHA=$(grep -m1 "certificate SHA-256 digest" "$RUNNER_TEMP/apksigner.txt" | sed 's/.*: //')
          echo "SHA-256 del certificado: $SHA"
          echo "### Firma del APK" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 del certificado: $SHA (debe ser identico en todas las compilaciones)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: crescendo-live-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
